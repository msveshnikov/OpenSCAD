<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a24">
  <link rel="icon" href="data:,">
  <title>Autumn Hollow | 3D Village</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #fff3df;
      background: #111a24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 70%, #55402e 0%, #202632 50%, #111a24 100%);
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      position: fixed;
      top: clamp(20px, 5vh, 52px);
      left: clamp(20px, 5vw, 64px);
      pointer-events: none;
      text-shadow: 0 2px 22px #111a24;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #ffc269;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 500 clamp(32px, 5vw, 56px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: -.035em;
    }

    .subtitle {
      max-width: 370px;
      margin: 12px 0 0;
      color: #d3c5b8;
      font-size: 14px;
      line-height: 1.55;
    }

    .controls {
      position: fixed;
      right: clamp(18px, 4vw, 48px);
      bottom: clamp(20px, 5vh, 48px);
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid #ffffff24;
      border-radius: 16px;
      background: #131923dc;
      box-shadow: 0 12px 40px #0005;
      backdrop-filter: blur(14px);
    }

    button {
      padding: 10px 14px;
      border: 1px solid #ffc26970;
      border-radius: 10px;
      background: #ffc26914;
      color: #ffe3b5;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: #ffc26930; }
    button:focus-visible { outline: 2px solid #ffc269; outline-offset: 3px; }

    .hint {
      position: fixed;
      bottom: 30px;
      left: clamp(20px, 5vw, 64px);
      color: #d3c5b8;
      font-size: 12px;
      pointer-events: none;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ffd28a;
      font-size: 14px;
      letter-spacing: .08em;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .loading.hidden { opacity: 0; }

    @media (max-width: 560px) {
      .subtitle { max-width: 260px; }
      .controls { right: 16px; bottom: 16px; }
      .hint { bottom: 82px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D autumn village with houses, pumpkins, and evergreen trees"></canvas>
  <header class="title">
    <p class="eyebrow">A tiny world at dusk</p>
    <h1>Autumn Hollow</h1>
    <p class="subtitle">A cozy little village tucked between the pines. Drag to wander around.</p>
  </header>
  <div class="controls">
    <button id="lights" type="button" aria-pressed="true">Window lights: on</button>
    <button id="reset" type="button">Reset view</button>
  </div>
  <p class="hint">Drag to orbit · Scroll to zoom</p>
  <div class="loading" id="loading">Settling into the village…</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script>
    (async () => {
      const canvas = document.querySelector("#scene");
      const loading = document.querySelector("#loading");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.72;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x202632, 115, 270);
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 500);
      const defaultCamera = new THREE.Vector3(100, 112, 190);
      const target = new THREE.Vector3(0, 16, 0);
      camera.position.copy(defaultCamera);
      camera.lookAt(target);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.055;
      controls.minDistance = 70;
      controls.maxDistance = 260;
      controls.maxPolarAngle = Math.PI * 0.48;

      scene.add(new THREE.HemisphereLight(0xffdfbd, 0x30402b, 0.72));
      const moonlight = new THREE.DirectionalLight(0xb9d2ff, 1.05);
      moonlight.position.set(-55, 100, 45);
      scene.add(moonlight);
      const warmLight = new THREE.PointLight(0xffa64a, 32, 130, 2);
      warmLight.position.set(0, 35, 0);
      scene.add(warmLight);

      let houseGeometry;
      let pumpkinGeometry;
      let treeGeometry;
      let carGeometry;
      try {
        const modelLoader = new THREE.STLLoader();
        [houseGeometry, pumpkinGeometry, treeGeometry, carGeometry] = await Promise.all([
          modelLoader.loadAsync("CozyHouse.stl"),
          modelLoader.loadAsync("NicePumpkin.stl"),
          modelLoader.loadAsync("Tree.stl"),
          modelLoader.loadAsync("VillageCar.stl")
        ]);
      } catch (error) {
        loading.textContent = "Village models could not be loaded. Serve this folder over HTTP.";
        console.error("Unable to load the OpenSCAD village models.", error);
        return;
      }

      const world = new THREE.Group();
      scene.add(world);
      const lanternLights = [];
      const animatedLeaves = [];
      const random = (() => {
        let seed = 12461;
        return () => {
          seed = (seed * 1664525 + 1013904223) % 4294967296;
          return seed / 4294967296;
        };
      })();

      function material(color, roughness = 0.85, extra = {}) {
        return new THREE.MeshStandardMaterial({ color, roughness, ...extra });
      }

      function addMesh(parent, geometry, mat, position, rotation) {
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.position.set(position[0], position[1], position[2]);
        if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
        parent.add(mesh);
        return mesh;
      }

      const grassMat = material(0x536d3c);
      const ground = addMesh(
        world,
        new THREE.CylinderGeometry(82, 88, 8, 96),
        grassMat,
        [0, -4, 0]
      );
      ground.receiveShadow = true;

      const pathCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-3, 0.18, 74),
        new THREE.Vector3(3, 0.18, 51),
        new THREE.Vector3(-8, 0.18, 33),
        new THREE.Vector3(-1, 0.18, 12),
        new THREE.Vector3(8, 0.18, -10),
        new THREE.Vector3(3, 0.18, -34),
        new THREE.Vector3(12, 0.18, -72)
      ]);
      const path = addMesh(
        world,
        new THREE.TubeGeometry(pathCurve, 80, 5.2, 8, false),
        material(0x9b805b),
        [0, 0, 0]
      );
      path.scale.y = 0.035;

      const stoneMat = material(0xc8b99a);
      for (let i = 0; i < 24; i++) {
        const point = pathCurve.getPoint((i + 0.5) / 24);
        const stone = addMesh(
          world,
          new THREE.CylinderGeometry(1.7 + random(), 2.1, 0.7, 7),
          stoneMat,
          [point.x + (random() - 0.5) * 5, 0.45, point.z]
        );
        stone.rotation.y = random() * Math.PI;
      }

      function createPine(scale = 1, color = 0x28543c) {
        const tree = new THREE.Mesh(treeGeometry, material(color));
        tree.rotation.x = -Math.PI / 2;
        tree.scale.setScalar(scale);
        return tree;
      }

      const treeSpots = [
        [-57, -42, 0.31], [-47, -60, 0.38], [-68, -13, 0.30], [-53, 26, 0.37],
        [-48, 57, 0.30], [-25, 67, 0.35], [26, 69, 0.32], [51, 57, 0.37],
        [66, 27, 0.31], [59, -8, 0.38], [66, -42, 0.33], [42, -60, 0.38],
        [18, -70, 0.29], [-22, -68, 0.33], [-72, 48, 0.28]
      ];
      treeSpots.forEach(([x, z, scale], index) => {
        const pine = createPine(scale, index % 3 === 0 ? 0x315e3d : 0x28543c);
        pine.position.set(x, 0, z);
        world.add(pine);
      });

      function createHouse(wallColor, scale = 1) {
        const house = new THREE.Group();
        const model = new THREE.Mesh(houseGeometry, material(wallColor));
        model.rotation.x = -Math.PI / 2;
        house.add(model);

        [-24, 24].forEach(x => {
          const lamp = new THREE.PointLight(0xffa442, 9, 28, 2);
          lamp.position.set(x, 23, 33);
          lamp.intensity = 3.5;
          house.add(lamp);
          lanternLights.push(lamp);
        });

        house.scale.setScalar(scale);
        return house;
      }

      [
        [-27, -14, 0.36, 0xe6b77f],
        [19, -31, 0.34, 0xd7c18f],
        [-20, 32, 0.31, 0xc98e69],
        [29, 22, 0.29, 0xd8c9a5]
      ].forEach(([x, z, scale, walls], index) => {
        const house = createHouse(walls, scale);
        house.position.set(x, 0, z);
        house.rotation.y = index % 2 === 0 ? 0.12 : Math.PI * 0.9;
        world.add(house);
      });

      function createCar(bodyColor, x, z, rotation = 0) {
        const car = new THREE.Group();
        car.position.set(x, 0, z);
        car.rotation.y = rotation;
        car.scale.setScalar(0.58);

        const modelAxes = new THREE.Group();
        modelAxes.rotation.x = -Math.PI / 2;
        car.add(modelAxes);
        addMesh(modelAxes, carGeometry, material(bodyColor), [0, 0, 0]);

        const windows = material(0x263e49, 0.4, {
          metalness: 0.15,
          roughness: 0.35
        });
        const tires = material(0x242322, 0.95);
        const hubs = material(0xc5b99e, 0.45, { metalness: 0.6 });
        const headlights = material(0xffe6a3, 0.35, {
          emissive: 0x805a20,
          emissiveIntensity: 0.7
        });
        const taillights = material(0x9e3024, 0.45, {
          emissive: 0x52120b,
          emissiveIntensity: 0.35
        });

        for (const side of [-1, 1]) {
          for (const y of [-12.5, 12.5]) {
            addMesh(
              modelAxes,
              new THREE.CylinderGeometry(4.4, 4.4, 2.8, 16),
              tires,
              [side * 10.8, y, 4.2],
              [0, 0, Math.PI / 2]
            );
            addMesh(
              modelAxes,
              new THREE.CylinderGeometry(2.2, 2.2, 0.3, 12),
              hubs,
              [side * 12.25, y, 4.2],
              [0, 0, Math.PI / 2]
            );
          }

          [-2.5, 3].forEach(y => {
            addMesh(modelAxes, new THREE.BoxGeometry(0.35, 4.5, 3.8), windows, [side * 8.05, y, 11.1]);
          });
          addMesh(modelAxes, new THREE.BoxGeometry(0.5, 1, 4.4), material(bodyColor), [side * 8.2, 0.3, 11.4]);
          addMesh(modelAxes, new THREE.BoxGeometry(2.6, 0.5, 1.4), headlights, [side * 7.3, -19, 5]);
          addMesh(modelAxes, new THREE.BoxGeometry(2.4, 0.5, 1.1), taillights, [side * 7.2, 19, 5]);
        }

        addMesh(modelAxes, new THREE.BoxGeometry(10, 0.35, 3.8), windows, [0, -5.8, 11.3]);
        addMesh(modelAxes, new THREE.BoxGeometry(9, 0.35, 3.4), windows, [0, 5.8, 11.4]);
        world.add(car);
      }

      createCar(0xa84632, -1, 65, -0.24);
      createCar(0x3e6474, 2, 40, -0.24);

      function createPumpkin(scale, color = 0xed7824) {
        const pumpkin = new THREE.Mesh(pumpkinGeometry, material(color));
        pumpkin.rotation.x = -Math.PI / 2;
        pumpkin.scale.setScalar(scale);
        return pumpkin;
      }

      [
        [-12, 17, 0.12, 0xe87922],
        [7, 7, 0.105, 0xf19a2d],
        [24, -4, 0.11, 0xe76d20],
        [-33, 7, 0.095, 0xb96831],
        [8, -49, 0.09, 0xe17a25],
        [-4, 40, 0.085, 0xef9b30],
        [40, 5, 0.08, 0xb96c35]
      ].forEach(([x, z, scale, color], index) => {
        const pumpkin = createPumpkin(scale, color);
        pumpkin.position.set(x, 4, z);
        pumpkin.rotation.y = index * 0.8;
        world.add(pumpkin);
      });

      const pebbleMat = material(0xcbb477, 0.55, { emissive: 0x68411c, emissiveIntensity: 0.45 });
      for (let i = 0; i < 12; i++) {
        const lantern = new THREE.Group();
        addMesh(lantern, new THREE.SphereGeometry(0.28, 8, 8), pebbleMat, [0, 0, 0]);
        lantern.position.set(-9 + i * 1.65, 0.9, 40 + Math.sin(i * 0.38) * 3);
        world.add(lantern);
      }

      const sky = new THREE.Group();
      scene.add(sky);
      const starMat = new THREE.MeshBasicMaterial({ color: 0xffe6ad });
      for (let i = 0; i < 90; i++) {
        const star = new THREE.Mesh(new THREE.SphereGeometry(0.25 + random() * 0.5, 6, 6), starMat);
        star.position.set((random() - 0.5) * 300, 58 + random() * 100, -100 - random() * 100);
        sky.add(star);
      }
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(8, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xffe3af })
      );
      moon.position.set(-78, 85, -100);
      sky.add(moon);

      document.querySelector("#lights").addEventListener("click", event => {
        const isOn = event.currentTarget.getAttribute("aria-pressed") !== "true";
        event.currentTarget.setAttribute("aria-pressed", String(isOn));
        event.currentTarget.textContent = `Window lights: ${isOn ? "on" : "off"}`;
        lanternLights.forEach(light => { light.visible = isOn; });
      });

      document.querySelector("#reset").addEventListener("click", () => {
        camera.position.copy(defaultCamera);
        controls.target.copy(target);
        controls.update();
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        warmLight.intensity = 32 + Math.sin(time * 2.3) * 2;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
      loading.classList.add("hidden");
      window.setTimeout(() => loading.remove(), 500);
    })();
  </script>
</body>
</html>
